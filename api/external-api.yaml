openapi: 3.0.3
info:
  title: Hasamex Transcript Analysis — External API Dependencies
  description: >
    Documents the external outbound services called by this application.
    These are invoked from the service layer (src/client/).
  version: 1.0.0

paths:

  # ══════════════════════════════════════════════════
  # Groq API — used by src/client/groq_client.py
  # LLM inference for interview-guide answers, themes,
  # quote selection, and RAG Q&A.
  # ══════════════════════════════════════════════════

  /openai/v1/chat/completions:
    post:
      tags: [Groq]
      summary: Generate chat completion
      description: >
        Sends grounded context + prompt to an open-source LLM served by Groq.
        Model: openai/gpt-oss-120b (default), configurable via settings.
        Used for: interview-guide answers, theme/disagreement analysis,
        quote candidate selection, and cross-transcript Q&A.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages]
              properties:
                model: { type: string, example: "openai/gpt-oss-120b" }
                messages:
                  type: array
                  items:
                    type: object
                    properties:
                      role: { type: string, enum: [system, user] }
                      content: { type: string }
                temperature: { type: number, default: 0.2, minimum: 0 }
                max_tokens: { type: integer, default: 1024 }
                response_format:
                  type: object
                  description: json_object when the task has a typed output contract
                  properties:
                    type: { type: string, enum: [text, json_object] }
      responses:
        '200':
          description: Completion with choices[0].message.content (text or JSON)
        '401':
          description: Invalid/expired API key
        '429':
          description: Rate limit exceeded (client must retry with backoff)
        '5xx':
          description: Groq outage (client must retry with backoff, max 5 attempts)

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >
        Groq API key from the GROQ_API_KEY environment variable (never hardcoded).