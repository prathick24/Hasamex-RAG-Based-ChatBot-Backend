openapi: 3.0.3
info:
  title: Hasamex Transcript Analysis — Internal API
  description: >
    Internal REST API for the transcript analysis application.
    Consumed by the Streamlit frontend. All routes are versioned under /api/v1.
  version: 1.0.0

servers:
  - url: http://localhost:8000

paths:

  # ══════════════════════════════════════════════════
  # Health / Readiness
  # ══════════════════════════════════════════════════

  /:
    get:
      tags: [System]
      summary: Root endpoint
      description: Returns application name and version.
      responses:
        '200':
          description: App metadata

  /health:
    get:
      tags: [System]
      summary: Liveness probe
      responses:
        '200':
          description: Service is alive

  /ready:
    get:
      tags: [System]
      summary: Readiness probe
      description: >
        Checks PostgreSQL connectivity, that the pgvector extension exists,
        that required tables exist, and returns parsed transcript/chunk counts.
      responses:
        '200':
          description: Dependencies ready
        '503':
          description: Dependency unavailable

  # ══════════════════════════════════════════════════
  # Transcripts
  # ══════════════════════════════════════════════════

  /api/v1/transcripts:
    post:
      tags: [Transcripts]
      summary: Ingest all transcripts
      description: >
        Reads all .txt transcripts from datas/, parses into timestamped chunks,
        embeds chunks, and stores idempotently in PostgreSQL (ON CONFLICT DO NOTHING).
      responses:
        '200':
          description: Ingestion summary (transcripts + chunks created/loaded)
          content:
            application/json:
              schema:
                type: object
                properties:
                  transcripts_count: { type: integer }
                  chunks_count: { type: integer }
                  loaded: { type: boolean }
    get:
      tags: [Transcripts]
      summary: List active transcripts
      description: >
        Returns active (non-soft-deleted) transcripts with their expert metadata
        and chunk counts, ordered by id.
      responses:
        '200':
          description: List of active transcript records
          content:
            application/json:
              schema:
                type: object
                properties:
                  transcripts:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        filename: { type: string }
                        expert_name: { type: string }
                        expert_role: { type: string }
                        market: { type: string }
                        chunk_count: { type: integer }

  /api/v1/transcripts/upload:
    post:
      tags: [Transcripts]
      summary: Upload one or more transcript files
      description: >
        Multipart upload of .txt transcript files (max 5 MB each). Each file is parsed,
        embedded, and stored. Re-uploading an existing filename soft-deletes the older
        version and stores a new one (version increments); the interview-guide cache for
        that file is purged. Per-file results report status: uploaded | replaced | error.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: Per-file upload results
          content:
            application/json:
              schema:
                type: object
                properties:
                  processed: { type: integer }
                  succeeded: { type: integer }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        filename: { type: string }
                        status:
                          type: string
                          enum: [uploaded, replaced, error]
                        transcript_id: { type: integer }
                        version: { type: integer }
                        chunk_count: { type: integer }
                        reason: { type: string }

  /api/v1/transcripts/{transcript_id}:
    delete:
      tags: [Transcripts]
      summary: Soft-delete a transcript
      description: >
        Deactivates a transcript so it is excluded from retrieval, lists, and counts.
        Its chunks remain in storage but are ignored by all active queries.
      parameters:
        - name: transcript_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Deletion result
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }

  # ══════════════════════════════════════════════════
  # Interview Guide Answers
  # ══════════════════════════════════════════════════

  /api/v1/analysis/interview-guide:
    get:
      tags: [Analysis]
      summary: Get interview guide answers for all experts
      description: >
        Returns the 6 interview-guide questions answered per expert, grounded in that
        expert's transcript chunks only, with citations. Deterministic answers are cached.
      responses:
        '200':
          description: Matrix of question x expert answers with citations
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    question_id: { type: integer }
                    question: { type: string }
                    answers:
                      type: array
                      items:
                        type: object
                        properties:
                          question_id: { type: integer }
                          expert: { type: string, description: Expert name }
                          answer: { type: string }
                          citations:
                            type: array
                            items:
                              type: object
                              properties:
                                transcript_file: { type: string }
                                expert_name: { type: string }
                                market: { type: string }
                                timestamp: { type: string }
                                quote: { type: string }

  /api/v1/analysis/interview-guide/stream:
    get:
      tags: [Analysis]
      summary: Stream interview guide answers (NDJSON)
      description: >
        Same data as /interview-guide but streamed line-by-line as Newline-Delimited JSON so
        the frontend can render progress. Events:
        - {"type":"meta","questions":[{"question_id","question"}]}  (once, first)
        - {"type":"batch","expert":str,"answers":[...]}  (one per expert batch, up to 3 questions)
        - {"type":"done"}
        - {"type":"error","detail":str}  (on failure)
      responses:
        '200':
          description: NDJSON event stream, one JSON object per line
          content:
            application/x-ndjson: {}

  # ══════════════════════════════════════════════════
  # Themes & Disagreements
  # ══════════════════════════════════════════════════

  /api/v1/analysis/themes:
    get:
      tags: [Analysis]
      summary: Identify themes and disagreements across all experts
      description: >
        Groups findings per interview-guide topic and returns consensus points,
        disagreements, and differences in emphasis, each with expert citations.
      responses:
        '200':
          description: Theme list with type labels and citations
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    topic: { type: string }
                    themes:
                      type: array
                      items:
                        type: object
                        properties:
                          type: { type: string, enum: [Consensus, Disagreement, Emphasis] }
                          summary: { type: string }
                          citations:
                            type: array
                            items:
                              type: object
                              properties:
                                transcript_file: { type: string }
                                expert_name: { type: string }
                                market: { type: string }
                                timestamp: { type: string }
                                quote: { type: string }

  /api/v1/analysis/themes/stream:
    get:
      tags: [Analysis]
      summary: Stream themes & disagreements (NDJSON)
      description: >
        Same data as /themes but streamed line-by-line as Newline-Delimited JSON so the
        frontend can render progress. Events:
        - {"type":"meta","topics":[{"index","topic"}]}  (once, first)
        - {"type":"topic","topic":str,"themes":[...]}  (one per topic)
        - {"type":"done"}
        - {"type":"error","detail":str}  (on failure)
      responses:
        '200':
          description: NDJSON event stream, one JSON object per line
          content:
            application/x-ndjson: {}

  # ══════════════════════════════════════════════════
  # Cross-Transcript Q&A
  # ══════════════════════════════════════════════════

  /api/v1/qa/ask:
    post:
      tags: [Q&A]
      summary: Ask a free-form question across all transcripts
      description: >
        Single chat endpoint with two operating modes:

        1. RAG answer (default) — embeds the user question, retrieves top-K chunks from
           all transcripts via cosine similarity, and generates a grounded answer with citations.

        2. Exact quote mode — when the user asks for a verbatim quote (e.g. "give me the exact
           quote about X"), the LLM is skipped entirely: hybrid search (semantic + keyword)
           returns raw verbatim chunks, each verified by substring match and returned with
           its timestamp. No AI interpretation applied.

        Mode is auto-detected from the question intent; an optional explicit `mode` override
        is accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                question: { type: string, example: "What slows down adoption in Germany?" }
                mode:
                  type: string
                  description: Optional override; auto-detected when omitted.
                  enum: [answer, quote]
                top_k: { type: integer, default: 5 }
      responses:
        '200':
          description: Grounded answer (mode=answer) with citations, OR verbatim quotes (mode=quote)
          content:
            application/json:
              schema:
                type: object
                properties:
                  question: { type: string }
                  mode:
                    type: string
                    enum: [answer, quote]
                  answer:
                    type: string
                    description: Present when mode=answer. Null/absent when mode=quote.
                  quotes:
                    type: array
                    description: Present when mode=quote. Each is a verified verbatim chunk.
                    items:
                      type: object
                      properties:
                        quote: { type: string }
                        transcript_file: { type: string }
                        expert_name: { type: string }
                        market: { type: string }
                        timestamp: { type: string }
                        verification_status:
                          type: string
                          enum: [verified, verification_failed]
                  citations:
                    type: array
                    items:
                      type: object
                      properties:
                        transcript_file: { type: string }
                        expert_name: { type: string }
                        market: { type: string }
                        timestamp: { type: string }
                        quote: { type: string }